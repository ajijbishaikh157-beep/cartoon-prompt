<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartoon Video Prompt</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0712;--pur:#2a0f4d;--pur2:#4b1d8f;--card:#17102a;--gold:#e8b84a;--gold2:#f6d77e;--tx:#f3eefc;--mut:#a99cc4;--ok:#5fd39a;--bad:#ff7a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;font-size:16px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{max-width:520px;margin:0 auto;padding-bottom:84px;min-height:100vh}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hdr{padding:18px 18px 22px;background:linear-gradient(160deg,var(--pur2),var(--pur) 60%,var(--bg));border-radius:0 0 28px 28px}
.hdr h1{font-size:30px;color:var(--gold2)}
.hdr p{color:var(--mut);margin-top:4px}
.badge{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:99px;background:#0b071266;border:1px solid var(--gold);color:var(--gold2);font-weight:700;font-size:14px}
.wrap{padding:16px 16px 0}
.sec{margin:6px 2px 12px;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;text-align:left;padding:14px;border-radius:18px;background:var(--card);border:1px solid #3a2a63;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.cat .em{font-size:30px}
.cat b{font-family:'Baloo 2',sans-serif;font-size:16px;line-height:1.15}
.cat small{color:var(--mut)}
.lock{position:absolute;top:10px;right:10px;font-size:16px}
.free{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;color:#1a1000;background:var(--gold);padding:2px 8px;border-radius:99px}
.back{padding:14px 16px 0;color:var(--gold2);font-weight:700}
.p{background:var(--card);border:1px solid #3a2a63;border-radius:16px;padding:14px;margin-bottom:12px}
.p h3{font-size:18px;margin-bottom:6px}
.p .txt{color:var(--tx);white-space:pre-wrap;line-height:1.5}
.p .blur{filter:blur(5px);user-select:none;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:11px 16px;border-radius:12px;font-weight:700;border:1px solid var(--gold);color:var(--gold2)}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1000;border:0}
.danger{border-color:var(--bad);color:var(--bad)}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:#120a22f2;border-top:1px solid #3a2a63;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;padding:8px 2px;font-size:12px;color:var(--mut);border-radius:12px}
.tabs button span{display:block;font-size:20px}
.tabs button.on{color:var(--gold2);background:#2a0f4d}
.plan{border:2px solid #3a2a63;border-radius:18px;padding:16px;margin-bottom:12px;background:var(--card);width:100%;text-align:left;display:block}
.plan.sel{border-color:var(--gold);background:linear-gradient(135deg,#2a0f4d,#17102a)}
.plan b{font-family:'Baloo 2',sans-serif;font-size:20px}
.plan .pr{color:var(--gold2);font-size:24px;font-weight:800}
ul.ft{list-style:none;padding:0;margin:10px 0 16px;line-height:1.9}
ul.ft li::before{content:"✦ ";color:var(--gold)}
input,textarea,select{width:100%;padding:11px;border-radius:12px;border:1px solid #3a2a63;background:#0b0712;color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:14px;color:var(--mut)}
.note{background:#2a0f4d88;border:1px dashed var(--gold);border-radius:14px;padding:12px;color:var(--gold2);font-size:14px;margin-bottom:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--gold);color:#1a1000;padding:10px 18px;border-radius:99px;font-weight:700;z-index:9}
.usr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #3a2a63}
.mut{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:18px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--gold);border-radius:20px;padding:20px;max-width:90%;width:420px}
dialog::backdrop{background:#000a}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DEF={
 cats:[["Kids Rhymes Prompts","🎵"],["Kids Cartoon Videos","🧸"],["2D Cartoon Stories","🎨"],["3D Cartoon Stories","🧊"],["Horror Cartoon Stories","👻"],["USA Cartoon Videos","🗽"],["Funny Cartoon Videos","😂"],["Moral Stories","🌱"],["Animal Cartoon Videos","🐘"],["Educational Cartoon Videos","📚"],["Mythological Cartoon Videos","🔱"],["3D Animation Prompts","🎬"],["Adventure Cartoon Stories","🧭"],["Fantasy Cartoon Videos","🐉"],["Short Cartoon Reels","📱"]].map((c,i)=>({id:i+1,name:c[0],icon:c[1]})),
 plans:[{id:"m",name:"Monthly",price:99,days:30},{id:"y",name:"Yearly",price:799,days:365}],
 users:[{id:1,email:"admin@cvp.app",role:"admin",hash:null,premium:false,expiry:null,plan:null}],
 me:null, tab:"home", prompts:[]
};
const SAMPLE={
 1:["Twinkle Star Rhyme","Bright 2D animated nursery rhyme: a smiling star dances over a sleepy village, pastel colors, bouncing lyrics on screen, 30 seconds, gentle lullaby tempo."],
 2:["Baby Bunny's Birthday","Cute 3D-style bunny turns one year old, balloons, cake, kids clapping, soft lighting, cheerful music, vertical 9:16, 20 seconds."],
 3:["The Paper Boat","2D hand-drawn story of a paper boat sailing a rainy street to find the sea. Warm watercolor look, narrator voice, 60 seconds."],
 4:["Robot Gardener","3D cartoon: a small robot grows the last flower on a gray planet. Pixar-like lighting, emotional music, 45 seconds."],
 5:["The Spooky Pumpkin","Kid-safe spooky cartoon: a shy pumpkin ghost scares nobody. Purple fog, big funny eyes, playful twist ending, 40 seconds."],
 6:["Road Trip Raccoon","US highway cartoon: a raccoon hitchhikes in a food truck across Route 66, retro 70s style, upbeat country soundtrack."],
 7:["Cat vs Robot Vacuum","Slapstick cartoon: a cat tries to defeat a robot vacuum, exaggerated expressions, comic sound effects, 25 seconds."],
 8:["The Honest Woodcutter","Moral story: a woodcutter returns a golden axe and is rewarded. Storybook 2D style, clear moral line at the end."],
 9:["Elephant's Big Splash","Animal cartoon: a baby elephant learns to swim with turtle friends, bright jungle colors, giggles, 30 seconds."],
 10:["Learn Shapes with Pip","Educational cartoon: Pip the penguin finds circles, squares, triangles on an iceberg. Big text labels, slow pacing for toddlers."],
 11:["Hanuman Leaps to the Sun","Mythological cartoon: child Hanuman jumps toward the sun, vibrant Indian art style, epic music, respectful tone, 45 seconds."],
 12:["Glass Dragon Egg","3D animation prompt: a glowing dragon egg cracks on a mossy rock, macro camera, volumetric light, 8 seconds, loopable."],
 13:["Treasure Map Twins","Adventure cartoon: twins follow a map through a jungle, bridge, and cave to find a treasure that is a friendship book."],
 14:["Cloud Castle Fox","Fantasy cartoon: a fox with a lantern climbs a staircase of clouds to a sleeping castle, dreamy pastel palette, 40 seconds."],
 15:["Chai Cup Dance","Short reel: a chai cup, biscuit and spoon dance to a lo-fi beat, 9:16, 12 seconds, bold outlines, loopable."]
};
let S;try{S=JSON.parse(localStorage.getItem("cvp3")||"null")}catch(e){S=null}
if(!S){S=JSON.parse(JSON.stringify(DEF));let id=1;
 for(const c of S.cats){const [a,b]=SAMPLE[c.id];S.prompts.push({id:id++,cat:c.id,title:a,text:b,free:c.id===1});
  S.prompts.push({id:id++,cat:c.id,title:a+" (Part 2)",text:b+" Add a new twist: a surprise guest character appears at the end.",free:false})}}
let view={cat:null,sel:"y"};
const save=()=>{try{localStorage.setItem("cvp3",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const me=()=>S.users.find(u=>u.id===S.me);
const isPrem=()=>{const u=me();return u.premium&&u.expiry&&new Date(u.expiry)>new Date()};
const fmt=d=>new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1800)}
function go(t){S.tab=t;view.cat=null;render()}
function status(){return isPrem()?`Premium until ${fmt(me().expiry)}`:"Free plan · 1 free prompt"}
function home(){
 const prem=isPrem();
 return `<div class="hdr"><h1>Cartoon Video Prompt</h1><p>Ready-made prompts for cartoon videos</p><span class="badge">${prem?"👑 ":"🔒 "}${status()}</span></div>
 <div class="wrap"><h2 class="sec">Categories</h2><div class="grid">${S.cats.map(c=>{
  const n=S.prompts.filter(p=>p.cat===c.id),f=n.filter(p=>p.free).length;
  const tag=prem?"":f?`<span class="free">${f} free</span>`:`<span class="lock" title="Premium">🔒</span>`;
  return `<button class="cat" data-cat="${c.id}">${tag}<span class="em">${c.icon}</span><span><b>${esc(c.name)}</b><br><small>${n.length} prompts</small></span></button>`}).join("")}</div></div>`}
function catView(){
 const c=S.cats.find(x=>x.id===view.cat),prem=isPrem();
 const list=S.prompts.filter(p=>p.cat===c.id);
 return `<button class="back" data-act="back">← All categories</button><div class="wrap"><h2 class="sec">${c.icon} ${esc(c.name)}</h2>
 ${list.length?list.map(p=>{const ok=p.free||prem;return `<div class="p"><h3>${ok?"":"🔒 "}${esc(p.title)}</h3>
 <div class="txt ${ok?"":"blur"}">${ok?esc(p.text):esc(p.text.slice(0,50))+" ••••••••••••••••••••••"}</div>
 <div class="row">${ok?`<button class="btn gold" data-copy="${p.id}">Copy prompt</button>`:`<button class="btn gold" data-act="up">Unlock with Premium</button>`}${p.free?`<span class="mut" style="align-self:center">Free</span>`:""}</div></div>`}).join(""):`<p class="empty">No prompts here yet.</p>`}</div>`}
function premium(){
 const u=me(),on=isPrem();
 return `<div class="hdr"><h1>👑 Go Premium</h1><p>Unlock every prompt in every category</p></div><div class="wrap">
 <div class="p"><h3>Your subscription</h3><p>${on?`Active · ends ${fmt(u.expiry)} · ${esc(u.plan||"")}`:u.expiry?`Expired on ${fmt(u.expiry)}`:"Free plan"}</p></div>
 <ul class="ft"><li>All 15 categories unlocked</li><li>Copy any prompt in one tap</li><li>New prompts added regularly</li></ul>
 ${S.plans.map(p=>`<button class="plan ${view.sel===p.id?"sel":""}" data-plan="${p.id}"><b>${esc(p.name)}</b><div class="pr">₹${p.price}</div><span class="mut">${p.days} days${p.id==="y"?" · best value":""}</span></button>`).join("")}
 <button class="btn gold" style="width:100%;padding:14px" data-act="buy">Subscribe</button>
 <p class="mut" style="margin-top:12px;font-size:14px">Premium unlocks only after the server verifies your payment. Screenshots or manual claims never unlock content.</p>
 <h2 class="sec" style="margin-top:22px">Payment history</h2>${(u.hist&&u.hist.length)?u.hist.map(h=>`<div class="usr"><span>${esc(h.plan)}<br><small class="mut">${fmt(h.date)}</small></span><b>₹${h.amt}</b></div>`).join(""):`<p class="empty">No payments yet. Verified payments will appear here.</p>`}</div>`}
function account(){
 const u=me();
 return `<div class="hdr"><h1>My account</h1><p>${esc(u.email)}</p><span class="badge">${status()}</span></div><div class="wrap">
 <div class="note">Demo login: accounts are saved only in this browser. The live website will use a real server login.</div><button class="btn gold" data-act="logout">Log out</button>
 <button class="btn" data-act="reset">Reset demo data</button>${legalLinks()}</div>`}
function admin(){
 return `<div class="hdr"><h1>Admin panel</h1><p>Manage prompts, categories, plans and users</p></div><div class="wrap">
 <div class="note">In the real app, only accounts with the admin role (checked on the server) can open this screen.</div>
 <div class="p"><h3>Add prompt</h3><label>Category</label><select id="ac">${S.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
 <label>Title</label><input id="at"><label>Prompt text</label><textarea id="ax" rows="3"></textarea>
 <label><input type="checkbox" id="af" style="width:auto;margin-right:8px">Free prompt</label><div class="row"><button class="btn gold" data-act="addp">Save prompt</button></div></div>
 <div class="p"><h3>New category</h3><input id="cn" placeholder="Category name"><input id="ci" placeholder="Emoji icon" maxlength="2"><button class="btn gold" data-act="addc">Create category</button></div>
 <div class="p"><h3>Subscription plans</h3>${S.plans.map(p=>`<label>${esc(p.name)} price (₹)</label><input type="number" min="1" value="${p.price}" data-price="${p.id}">`).join("")}<button class="btn gold" data-act="plans">Save plans</button></div>
 <div class="p"><h3>Users and premium access</h3>${S.users.map(u=>`<div class="usr"><span>${esc(u.email)}<br><small class="mut">${u.premium&&u.expiry?"Premium to "+fmt(u.expiry):"Free"}</small></span>
 <span class="row" style="margin:0"><button class="btn" data-grant="${u.id}">${u.premium?"Revoke":"Grant 30 days"}</button></span></div>`).join("")}
 <p class="mut" style="font-size:13px;margin-top:8px">Manual grant is for testing or support. Customer premium comes from verified payments only.</p></div>
 <h2 class="sec">All prompts</h2>${S.prompts.map(p=>`<div class="usr"><span>${esc(p.title)}<br><small class="mut">${esc(S.cats.find(c=>c.id===p.cat)?.name||"")}${p.free?" · Free":""}</small></span><span class="row" style="margin:0"><button class="btn" data-edit="${p.id}">Edit</button><button class="btn danger" data-del="${p.id}">Delete</button></span></div>`).join("")}</div>`}
function render(){
 if(!me()){$("#app").innerHTML=loginView();return}
 const adm=me().role==="admin";if(S.tab==="adm"&&!adm)S.tab="home";
 const v=S.tab==="home"?(view.cat?catView():home()):S.tab==="prem"?premium():S.tab==="acc"?account():admin();
 const T=[["home","🏠","Home"],["prem","👑","Premium"],["acc","👤","Account"]];if(adm)T.push(["adm","🛠","Admin"]);
 $("#app").innerHTML=v+`<nav class="tabs">${T.map(t=>`<button data-tab="${t[0]}" class="${S.tab===t[0]?"on":""}"><span>${t[1]}</span>${t[2]}</button>`).join("")}</nav>`;
 window.scrollTo(0,0)}
document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.tab)return go(d.tab);
 if(d.legal)return legal(d.legal);
 if(d.cat){view.cat=+d.cat;return render()}
 if(d.plan){view.sel=d.plan;return render()}
 if(d.copy){const p=S.prompts.find(x=>x.id==d.copy);try{await navigator.clipboard.writeText(p.text);toast("Prompt copied")}catch(_){toast("Select and copy manually")}return}
 if(d.grant){const u=S.users.find(x=>x.id==d.grant);if(u.premium){u.premium=false;u.expiry=null}else{u.premium=true;u.plan="Admin grant";u.expiry=new Date(Date.now()+30*864e5).toISOString();(u.hist=u.hist||[]).push({plan:"Admin grant (test)",date:new Date().toISOString(),amt:0})}save();return render()}
 if(d.del){if(confirm("Delete this prompt?")){S.prompts=S.prompts.filter(p=>p.id!=d.del);save();render()}return}
 if(d.edit){const p=S.prompts.find(x=>x.id==d.edit);const t=prompt("Edit title",p.title);if(t===null)return;const x=prompt("Edit prompt text",p.text);p.title=t||p.title;if(x)p.text=x;save();return render()}
 switch(d.act){
  case"back":view.cat=null;return render();
  case"logout":S.me=null;save();return render();
  case"login":{const e=$("#le").value.trim().toLowerCase(),h=await H($("#lp").value);const u=S.users.find(x=>x.email===e&&x.hash===h);if(!u)return toast("Wrong email or password");S.me=u.id;S.tab="home";save();return render()}
  case"signup":{const e=$("#le").value.trim().toLowerCase(),p=$("#lp").value;if(!/^\S+@\S+\.\S+$/.test(e))return toast("Enter a valid email");if(p.length<6)return toast("Password too short");if(S.users.some(x=>x.email===e))return toast("Email already registered");const id=Date.now();S.users.push({id,email:e,hash:await H(p),role:"user",premium:false,expiry:null,plan:null});S.me=id;S.tab="home";save();return render()}
  case"up":return go("prem");
  case"reset":localStorage.removeItem("cvp3");S=JSON.parse(JSON.stringify(DEF));location.reload();return;
  case"buy":{const pl=S.plans.find(p=>p.id===view.sel);
   const dlg=document.createElement("dialog");dlg.innerHTML=`<h3>Payments not connected yet</h3><p style="margin:10px 0;line-height:1.5">${esc(pl.name)} plan (₹${pl.price}) will be paid through Google Play Billing. In this prototype no money is taken and nothing is unlocked. Premium turns on only after the server verifies a real purchase.</p><button class="btn gold">OK</button>`;
   document.body.append(dlg);dlg.showModal();dlg.querySelector("button").onclick=()=>{dlg.close();dlg.remove()};return}
  case"addp":{const t=$("#at").value.trim(),x=$("#ax").value.trim();if(!t||!x)return toast("Title and text needed");
   S.prompts.push({id:Date.now(),cat:+$("#ac").value,title:t,text:x,free:$("#af").checked});save();toast("Prompt saved");return render()}
  case"addc":{const n=$("#cn").value.trim();if(!n)return toast("Name needed");S.cats.push({id:Date.now(),name:n,icon:$("#ci").value||"⭐"});save();toast("Category created");return render()}
  case"plans":document.querySelectorAll("[data-price]").forEach(i=>{const p=S.plans.find(x=>x.id===i.dataset.price);const v=+i.value;if(v>0)p.price=v});save();return toast("Plans saved")}
});
const H=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
function loginView(){return `<div class="hdr"><h1>Cartoon Video Prompt</h1><p>Log in to see your prompts</p></div><div class="wrap"><label>Email</label><input id="le" type="email" autocomplete="email"><label>Password (min 6 characters)</label><input id="lp" type="password" autocomplete="current-password"><div class="row"><button class="btn gold" data-act="login">Log in</button><button class="btn" data-act="signup">Create account</button></div><div class="note" style="margin-top:16px">Demo admin: admin@cvp.app / admin123. Accounts live only in this browser. Replace with real server login before launch.</div>${legalLinks()}</div>`}
const LG={privacy:["Privacy Policy","<p>We collect only your email address and subscription status to run your account. We never store card, UPI or bank details; payments are handled by our payment partner (Razorpay). We do not sell your data. To delete your account and data, email us at the address on the Contact page.</p>"],terms:["Terms & Conditions","<p>Cartoon Video Prompt sells access to a library of text prompts for making cartoon videos. One prompt is free. Premium (monthly or yearly) unlocks all prompts for the paid period. Prompts are for your own use; do not resell or republish the library. Premium turns on only after we verify your payment. Prices are in Indian Rupees and may change for future purchases.</p>"],refund:["Refund & Cancellation","<p>Cancellation: you can stop renewing at any time and keep access until your plan ends. Refunds: because prompts are digital content available instantly, payments are not refundable once Premium is active. If you were charged twice, or charged but Premium did not turn on, email us within 7 days and we will fix it or refund you.</p>"],contact:["Contact Us","<p>Business: Cartoon Video Prompt<br>Email: jayama231@gmail.com</p><p>We reply within 2 working days.</p>"]};
const legalLinks=()=>`<p style="margin-top:22px;text-align:center;font-size:14px">${Object.keys(LG).map(k=>`<button data-legal="${k}" style="color:var(--gold2);text-decoration:underline;margin:0 8px">${LG[k][0].split(" ")[0]}</button>`).join("")}</p>`;
function legal(k){const d=document.createElement("dialog");d.innerHTML=`<h3>${LG[k][0]}</h3><div style="margin:10px 0;line-height:1.6">${LG[k][1]}</div><button class="btn gold">Close</button>`;document.body.append(d);d.showModal();d.querySelector("button").onclick=()=>{d.close();d.remove()}}
(async()=>{const a=S.users[0];if(!a.hash){a.hash=await H("admin123");save()}render()})();
</script>
</body>
</html>
